<html lang="en">

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505;

            overflow-x: hidden;
        }

        html {
            scroll-behavior: smooth;

        ::-webkit-scrollbar {

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Simple wrapper for Lucide icons to work in React browser environment
        const Icon = ({ name, size = 24, className = "" }) => {
            const [svg, setSvg] = useState("");

            useEffect(() => {
                if (window.lucide) {
                    const iconNode = window.lucide.icons[name];
                    if (iconNode) {
                        // Create a temporary element to get the SVG string
                        const div = document.createElement('div');
                        const svgElement = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                        
                        // Set attributes
                        Object.entries(iconNode[1]).forEach(([key, value]) => {
                            svgElement.setAttribute(key, value);
                        });
                        
                        svgElement.setAttribute('width', size);
                        svgElement.setAttribute('height', size);
                        svgElement.setAttribute('class', className);
                        
                        // Add paths/circles/etc
                        iconNode[2].forEach(([tag, attrs]) => {
                            const child = document.createElementNS("http://www.w3.org/2000/svg", tag);
                            Object.entries(attrs).forEach(([key, value]) => {
                                child.setAttribute(key, value);
                            });
                            svgElement.appendChild(child);
                        });
                        
                        setSvg(svgElement.outerHTML);
                    }
                }
            }, [name, size, className]);

            return <span dangerouslySetInnerHTML={{ __html: svg }} className="inline-flex items-center justify-center" />;
        };

        const BentoCard = ({ children, className = "", title = "" }) => (
            <div className={`relative group overflow-hidden rounded-3xl border border-white/10 bg-gradient-to-br from-white/5 to-white/[0.02] backdrop-blur-xl p-6 transition-all duration-500 hover:border-white/40 hover:shadow-[0_0_30px_rgba(255,255,255,0.05)] ${className}`}>

                <div className="relative z-10">{children}</div>
            </div>
        );

            const [activeTab, setActiveTab] = useState('home');

                    <main className="max-w-7xl mx-auto px-6 pt-32 pb-24 space-y-6">

                        </section>

                            <BentoCard className="md:col-span-7" title="Achievements & Certifications">
                                <div className="space-y-5">
                                    {[
                                        { icon: <Icon name="award" className="text-yellow-500" />, title: "Top 1 Ambassador", sub: "Intelogix • Tech Support LOB" },
