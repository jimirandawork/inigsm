<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Iñigo Miranda | Portfolio</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; scroll-behavior: smooth; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // We are putting the icons here so the browser doesn't get confused
        const { 
          Briefcase, MessageSquare, Award, Mail, ExternalLink, Linkedin, Instagram, 
          Smartphone, Video, Users, HeartHandshake, Cpu, ChevronRight, Globe, 
          Settings, ShieldCheck, FileCheck, Facebook, ShoppingBag, Palette, 
          ClipboardCheck, Layout, Search, PieChart, Presentation, Headphones 
        } = window.Lucide || {};

        // If Lucide didn't load from a CDN, we'll use simple spans for now to ensure it loads
        const Icon = ({ name: Component, ...props }) => {
            return Component ? <Component {...props} /> : <span className="w-4 h-4 bg-white/10 rounded" />;
        };

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('home');

            const BentoCard = ({ children, className = "", title = "" }) => (
                <div className={`relative group overflow-hidden rounded-3xl border border-white/10 bg-gradient-to-br from-white/5 to-white/[0.02] backdrop-blur-xl p-6 transition-all duration-500 hover:border-silver/40 hover:shadow-[0_0_30px_rgba(255,255,255,0.05)] ${className}`}>
                    <div className="absolute inset-0 bg-gradient-to-br from-white/10 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500" />
                    {title && <h3 className="text-[#c0c0c0]/50 uppercase tracking-[0.2em] text-[10px] font-bold mb-4">{title}</h3>}
                    <div className="relative z-10">{children}</div>
                </div>
            );

            return (
                <div className="min-h-screen bg-[#050505] text-white selection:bg-white/30 font-sans overflow-x-hidden">
                    <div className="fixed inset-0 pointer-events-none">
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-500/5 rounded-full blur-[120px]" />
                        <div className="absolute bottom-[10%] right-[-5%] w-[30%] h-[30%] bg-purple-500/5 rounded-full blur-[120px]" />
                    </div>

                    <nav className="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-1 p-1.5 rounded-full bg-black/40 border border-white/10 backdrop-blur-md">
                        {['home', 'about', 'work', 'testimonials', 'contact'].map((tab) => (
                            <button
                                key={tab}
                                onClick={() => {
                                    document.getElementById(tab)?.scrollIntoView({ behavior: 'smooth' });
                                    setActiveTab(tab);
                                }}
                                className={`px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest transition-all duration-300 ${
                                    activeTab === tab ? 'bg-white text-black' : 'text-white/60 hover:text-white'
                                }`}
                            >
                                {tab}
                            </button>
                        ))}
                    </nav>

                    <main className="max-w-7xl mx-auto px-6 pt-32 pb-24 space-y-6">
                        <section id="home" className="grid grid-cols-1 md:grid-cols-12 gap-6 min-h-[70vh]">
                            <BentoCard className="md:col-span-8 flex flex-col justify-center min-h-[400px]">
                                <div className="space-y-6">
                                    <span className="inline-block px-4 py-1 rounded-full border border-white/10 text-[10px] tracking-[0.3em] uppercase bg-white/5 text-[#c0c0c0]">Available for Strategic Partnerships</span>
                                    <h1 className="text-5xl md:text-7xl font-black tracking-tight leading-[0.9] text-white">
                                        HI! I AM <br/> 
                                        <span className="opacity-60">JOHN IÑIGO SR. MIRANDA</span>
                                    </h1>
                                    <p className="text-xl text-white/60 max-w-xl font-light leading-relaxed">
                                        I help brands, teams, and businesses tell better stories, hire the right people, and build systems that actually work.
                                    </p>
                                </div>
                            </BentoCard>
                            <BentoCard className="md:col-span-4 p-0 group overflow-hidden">
                                <img src="https://i.postimg.cc/cHBDY2xx/IMG-7442.jpg" className="w-full h-full object-cover grayscale brightness-90 group-hover:grayscale-0 transition-all duration-700" />
                            </BentoCard>
                        </section>

                        <section id="about" className="grid grid-cols-1 md:grid-cols-12 gap-6">
                            <BentoCard className="md:col-span-4" title="Expertise">
                                <div className="p-4 rounded-2xl bg-white/5 border border-white/10">
                                    <p className="text-2xl font-bold text-white">Magna Cum Laude</p>
                                    <p className="text-xs text-white/40 uppercase">B.S. Psychology • National University</p>
                                </div>
                            </BentoCard>
                            <BentoCard className="md:col-span-8" title="The Approach">
                                <h2 className="text-3xl font-bold italic">“I’m a multipotentialite who thrives at the intersection of people, creativity, and systems.”</h2>
                                <p className="text-lg text-white/70 mt-4 font-light">I graduated Magna Cum Laude... Certified Human Resource Associate (CHRA) and a Registered Psychometrician (RPm).</p>
                            </BentoCard>
                        </section>

                        {/* Simplified for quick loading */}
                        <section id="work">
                           <h2 className="text-4xl font-black uppercase italic mb-6">Professional Experience</h2>
                           <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                              <BentoCard title="Content Strategy"><p className="text-sm text-white/60">Storytelling, vlogs, and trend adaptation.</p></BentoCard>
                              <BentoCard title="Talent & HR"><p className="text-sm text-white/60">Recruitment, dashboards, and candidate experience.</p></BentoCard>
                              <BentoCard title="Tech Support"><p className="text-sm text-white/60">High-volume troubleshooting and resolution.</p></BentoCard>
                           </div>
                        </section>

                        <section id="contact" className="grid grid-cols-1 md:grid-cols-12 gap-6">
                            <BentoCard className="md:col-span-12 bg-white text-black p-12 text-center">
                                <h2 className="text-5xl font-black uppercase">Let's Connect</h2>
                                <p className="mt-4 font-bold">jimirandawork@gmail.com</p>
                            </BentoCard>
                        </section>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
